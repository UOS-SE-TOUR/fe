name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에 연달아 push하면 앞선 검사는 취소한다(main push는 커밋마다 따로 돈다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: install
        run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 서식은 npm run format으로 바로 고쳐지니 맨 뒤에 두되, 앞 단계가 실패해도 결과가 함께 보이게 따로 돌린다
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
